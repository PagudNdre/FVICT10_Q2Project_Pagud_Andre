<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        :root {
            --bg-color: #363643;
            --card-bg: #24254e99;
            --text-color: #ffffff;
            --border-color: #000000;
            --button-bg: #b7950c;
            --button-text: #000000;
            --button-hover: #333333;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            gap: 20px;
        }

        main {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 1.75rem 0;
            text-align: center;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text-color);
            border: 1.5px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #888888;
        }

        input:focus {
            outline: none;
            border-color: #282323;
            box-shadow: 0 0 0 1px #000000;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--button-text);
            background-color: var(--button-bg);
            border: 1.5px solid #c8adad;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        #output {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1.5rem;
            text-align: center;
            min-height: 1.5rem;
        }

        .navbar {
            background-color: #211d41;
            padding: 8px 16px;
            text-align: center;
            width: fit-content;
            margin: 0 auto;
            border-radius: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            display: inline-block;
            border-radius: 6px;
            font-size: 14px;
        }

        .navbar a:hover {
            background-color: #555555;
        }
    </style>

    <script type="py" src="STmain.py"></script>
</head>
<body>
    <nav class="navbar">
        <a href="SW1.html">Home Page</a>
        <a href="ST.html">Element Checker</a>
        <a href="DRILL1.html">Club Member Checker</a>
        <a href="main.html">Creator</a>
    </nav>

    <main>
        <div class="container">
            <h1>Non-Metal Element Checker</h1>
            <p>Search a non-element metal ONLY</p>

            <input type="text" id="element1" placeholder="Example: Carbon">
        </div>

        <br><br>

        <button py-click="search_element">
            Search Element
        </button>

        <div class="result"></div>

        <br>
        <h3>| Result |</h3>
        <p><b>Atomic Name: <span id="name"></span></b></p>
        <p><b>Atomic Symbol: <span id="symbol"></span></b></p>
        <p><b>Atomic Number: <span id="number"></span></b></p>
        <p><b>Atomic Mass: <span id="mass"></span></b></p>
    </main>
</body>
</html>
